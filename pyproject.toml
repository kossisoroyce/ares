[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ares-agent"
dynamic = ["version"]
description = "Ares — AI-native host security investigator for Linux: continuous eBPF telemetry with minute-by-minute AI investigation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kossiso Royce" }]
maintainers = [{ name = "Kossiso Royce" }]
keywords = [
    "security",
    "edr",
    "ebpf",
    "linux",
    "ai",
    "llm",
    "threat-detection",
    "incident-response",
    "dfir",
    "devsecops",
    "host-security",
    "openrouter",
    "runtime-security",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "ulid-py>=1.1",
    # Default AI investigator path is OpenRouter via the OpenAI-compatible SDK.
    "openai>=1.30",
]

[project.urls]
Homepage = "https://github.com/kossisoroyce/ares"
Repository = "https://github.com/kossisoroyce/ares"
Documentation = "https://github.com/kossisoroyce/ares/tree/main/docs"
Issues = "https://github.com/kossisoroyce/ares/issues"
Changelog = "https://github.com/kossisoroyce/ares/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Cross-platform filesystem watching (dev + fallback).
fs = ["watchdog>=3.0"]
# Anthropic-native investigator provider (OpenRouter/OpenAI work without this).
ai = ["anthropic>=0.39"]
# Local HTTP API.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1",
    "pre-commit>=3.7",
    "watchdog>=3.0",
]

[project.scripts]
ares = "ares.cli.main:cli"

[tool.hatch.version]
path = "src/ares/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ares",
    "bpf",
    "systemd",
    "rules",
    "docs",
    "examples",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/ares"]
